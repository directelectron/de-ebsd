[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de-ebsd"
version = "0.1.0"
description = "Differentiable, GPU-accelerated dynamical EBSD master-pattern simulation in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Carter Francis", email = "cartsfrancis@gmail.com" }]
keywords = [
    "EBSD",
    "dynamical-diffraction",
    "Bloch-wave",
    "master-pattern",
    "pytorch",
    "kikuchipy",
]
dependencies = [
    "numpy",
    "torch>=2.4",
    "orix",
    "diffsims",
    "h5py",
    "anyplotlib",
    "anywidget",
]

[project.optional-dependencies]
# kikuchipy is only needed to load reference/validation master patterns.
validate = ["kikuchipy"]

[dependency-groups]
dev = ["pytest", "ruff", "kikuchipy"]
# `uv sync --group notebook` to run examples/*.ipynb. ipywidgets (which the
# anywidget-based .show() widgets need) already arrives with anywidget.
notebook = ["jupyterlab", "ipykernel", "nbclient"]
docs = [
    "sphinx>=7",
    "sphinx-gallery>=0.19",
    "pydata-sphinx-theme>=0.16",
    "numpydoc",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-codeautolink",
    "sphinxcontrib-bibtex",
    "pillow",
    "kikuchipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"de_ebsd.viz" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tests import after pytest.importorskip(...) on purpose
"tests/**" = ["E402"]
# auto-generated numeric table: long lines / formatting are fine
"src/de_ebsd/crystal/data/scattering_tables.py" = ["E501"]
# Embedded JavaScript is formatted for browser readability, not Python width.
"src/de_ebsd/viz/widgets.py" = ["E501"]
"scripts/**" = ["E402"]
# Final expressions are the gallery/notebook display protocol.
"examples/**/*.py" = ["B018"]

# --- uv ---------------------------------------------------------------------
# torch is pulled from the CUDA 12.4 index so the Pascal (sm_61) dev GPU works.
# `uv sync` then `uv run ...`.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
