[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "de-ebsd"
dynamic = ["version"]
description = "Differentiable, GPU-accelerated EBSD: dynamical master-pattern simulation, Monte Carlo transport, indexing, refinement and HR-EBSD, in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carter Francis", email = "cartsfrancis@gmail.com" }]
keywords = [
    "EBSD",
    "dynamical-diffraction",
    "Bloch-wave",
    "master-pattern",
    "pytorch",
    "kikuchipy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "torch>=2.4",
    "orix",
    "diffsims",
    "h5py",
    "anyplotlib",
    "anywidget",
]

[project.urls]
Homepage = "https://github.com/CSSFrancis/de-ebsd"
Source = "https://github.com/CSSFrancis/de-ebsd"
Issues = "https://github.com/CSSFrancis/de-ebsd/issues"
Changelog = "https://github.com/CSSFrancis/de-ebsd/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
# kikuchipy is only needed to load reference/validation master patterns.
validate = ["kikuchipy"]
# CuPy compiles the fused kernels of live indexing (de_ebsd.index.live) at run
# time; without it the same steps run as plain torch, ~25x slower.
live = ["cupy-cuda12x"]

[dependency-groups]
dev = ["pytest", "ruff", "kikuchipy"]
# `uv sync --group notebook` to run examples/*.ipynb. ipywidgets (which the
# anywidget-based .show() widgets need) already arrives with anywidget.
notebook = ["jupyterlab", "ipykernel", "nbclient"]
docs = [
    "sphinx>=7",
    "sphinx-gallery>=0.19",
    "pydata-sphinx-theme>=0.16",
    "numpydoc",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-codeautolink",
    "sphinxcontrib-bibtex",
    "pillow",
    "kikuchipy",
]

[tool.setuptools.dynamic]
version = { attr = "de_ebsd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"de_ebsd.viz" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tests import after pytest.importorskip(...) on purpose
"tests/**" = ["E402"]
# auto-generated numeric table: long lines / formatting are fine
"src/de_ebsd/crystal/data/scattering_tables.py" = ["E501"]
# Embedded JavaScript is formatted for browser readability, not Python width.
"src/de_ebsd/viz/widgets.py" = ["E501"]
"scripts/**" = ["E402"]
# Final expressions are the gallery/notebook display protocol.
"examples/**/*.py" = ["B018"]

# --- uv ---------------------------------------------------------------------
# On Windows torch is pulled from the CUDA 12.4 index so the Pascal (sm_61) dev
# GPU works, and on Linux from the CPU index, so CI does not download CUDA; macOS
# gets PyPI's. Only `uv` reads this --
# the published package just requires `torch`. `uv sync` then `uv run ...`.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

# --- towncrier ----------------------------------------------------------------
# CHANGELOG.rst is assembled from one fragment file per PR under
# upcoming_changes/ (see its README.rst), written while the change is fresh.
# The Prepare Release workflow passes the version explicitly.
[tool.towncrier]
directory        = "upcoming_changes"
filename         = "CHANGELOG.rst"
start_string     = ".. towncrier release notes start\n"
issue_format     = "`#{issue} <https://github.com/CSSFrancis/de-ebsd/pull/{issue}>`_"
title_format     = "{version} ({project_date})"
underlines       = ["=", "-", "~"]

[[tool.towncrier.type]]
directory    = "api_change"
name         = "API and Behaviour Changes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "new_feature"
name         = "New Features"
showcontent  = true

[[tool.towncrier.type]]
directory    = "bugfix"
name         = "Bug Fixes"
showcontent  = true

[[tool.towncrier.type]]
directory    = "performance"
name         = "Performance"
showcontent  = true

[[tool.towncrier.type]]
directory    = "deprecation"
name         = "Deprecations"
showcontent  = true

[[tool.towncrier.type]]
directory    = "removal"
name         = "Removals"
showcontent  = true

[[tool.towncrier.type]]
directory    = "doc"
name         = "Documentation"
showcontent  = true

[[tool.towncrier.type]]
directory    = "maintenance"
name         = "Maintenance"
showcontent  = true
