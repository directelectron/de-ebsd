name: Docs

# Pull requests build the site and attach it as a downloadable artifact so a
# reviewer can read the rendered pages. Pushes to main build the same site and
# publish it to GitHub Pages. CPU only: every gallery example runs on a runner
# with no GPU and no external reference files.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Build the site
        run: uv run --no-sync python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload the site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

      - name: Upload the site for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    # Only one deployment runs at a time, and a newer one replaces a queued one
    # without interrupting the one in flight.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
