name: Release

# Fires when a version tag is pushed (after the Prepare Release PR is merged).
#
# Jobs:
#   build    - refuse a tag that disagrees with the version in __init__.py;
#              build wheel + sdist; check the metadata;
#              install the wheel into a clean env and import it
#   publish  - upload to PyPI via OIDC trusted publishing (no API token)
#   release  - create a GitHub Release with the dist files and changelog notes

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write    # create GitHub Releases and upload assets
  id-token: write    # OIDC token for PyPI trusted publishing

jobs:
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true

      # A tag that does not match the code would publish one version number
      # with another's contents — and PyPI never lets a version be replaced.
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          I=$(grep '^__version__ = ' src/de_ebsd/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          if [ "v$I" != "$TAG" ]; then
            echo "::error::tag $TAG, __init__.py $I -- they must agree (run Prepare Release)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      # The wheel alone, with PyPI's dependencies (CPU torch), outside the
      # checkout — catches a module or data file missing from the package.
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import de_ebsd, de_ebsd.index, de_ebsd.viz; print(de_ebsd.__version__)"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/de-ebsd

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing - no API token required.
      # One-time setup on pypi.org: add a pending publisher for
      #   Project: de-ebsd  Owner: directelectron  Repo: de-ebsd
      #   Workflow: release.yml  Environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # --------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import re, pathlib, os
          version = os.environ["TAG"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.rst").read_text()
          parts = re.split(r"(?m)(?=^\S[^\n]*\n=+\n)", text)
          section = next((p.strip() for p in parts if p.strip().startswith(version + " ")), None)
          notes = section or f"Release v{version}\n\nSee CHANGELOG.rst."
          pathlib.Path("release_notes.md").write_text(notes)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ b[0-9]+$ ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            dist/*
